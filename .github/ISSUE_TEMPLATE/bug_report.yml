name: Bug 报告
description: 报告软件运行中的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告 Bug！请尽量填写以下信息，帮助维护者快速定位问题。
  - type: input
    id: version
    attributes:
      label: 版本号
      description: 软件内显示的版本号（如 v2.1.1）
      placeholder: "v2.1.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 操作系统及版本（如 Windows 11 23H2）
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？预期应该是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 1. 打开... 2. 点击... 3. 出现...
      placeholder: |
        1. 打开软件
        2. 播放某首歌
        3. 切换到 XX 预设
        4. 崩溃/卡顿/...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志/截图
      description: 如有报错信息、日志文件或截图，请附上
  - type: dropdown
    id: area
    attributes:
      label: 问题模块
      options:
        - 播放/音源
        - 落雪 LX 音源
        - 视觉/粒子
        - 歌词
        - 3D 歌单架
        - 登录/账号
        - 更新/安装
        - 其他
    validations:
      required: true
