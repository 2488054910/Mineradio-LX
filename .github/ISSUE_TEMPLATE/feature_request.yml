name: 功能请求
description: 提出新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你期望的功能和使用场景。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这个功能？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望它如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否有现成的替代方案？为什么不够好？
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 高（影响日常使用）
        - 中（有明确需求）
        - 低（锦上添花）
    validations:
      required: true
